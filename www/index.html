<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIVI MUSIC</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap");
:root{--r:#e10600;--soft:#a39a9a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:"Montserrat",sans-serif;overflow:hidden}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}

.stage{position:relative;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(225,6,0,.24),transparent 62%)}
.bar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:18px 18px 0}
.logo{font-weight:800;font-size:20px}
.logo i{font-style:normal;color:var(--r)}
.ib{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--r);background:none;color:#fff;font-size:22px}

.dunes{position:absolute;left:0;right:0;bottom:50px;width:100%;height:36dvh}
.mid{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-bottom:70px}
.row{display:flex;align-items:center;gap:6px;width:100%;justify-content:center}
.nv{width:44px;height:44px;border:0;background:none;color:#fff;font-size:36px;line-height:1;opacity:.75}

.wrap{position:relative;width:min(60vw,40dvh);aspect-ratio:1}
.halo{position:absolute;inset:9%;border-radius:50%}
.stage:not(.playing) .halo{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.sun{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:50%;cursor:pointer;color:#fff;
  background:radial-gradient(circle at 36% 30%,#ff4b3d,#e10600 46%,#7d0000);
  box-shadow:0 0 calc(30px + var(--g,0)*110px) rgba(225,6,0,calc(.3 + var(--g,0)*.55));
  will-change:transform;display:flex;align-items:center;justify-content:center}
#ic{font-size:clamp(26px,8vw,42px);opacity:.92}
.ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#hit{pointer-events:stroke;touch-action:none;cursor:pointer}

.ti{font-weight:800;font-size:clamp(22px,7vw,30px);text-align:center;line-height:1.1;padding:0 26px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tm{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;margin-top:-6px}
.tools{display:flex;gap:30px}
.tools button{background:none;border:0;color:#fff;font-size:22px;opacity:.55;padding:6px}
.tools button.on{opacity:1;color:var(--r)}

.sheet{position:fixed;left:0;right:0;bottom:0;height:78dvh;z-index:5;display:flex;flex-direction:column;
  background:#0c0000;border-top:2px solid var(--r);border-radius:24px 24px 0 0;
  transform:translateY(calc(100% - 62px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grab{height:62px;flex-shrink:0;width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:none;border:0;color:#fff;font:inherit;font-weight:700;font-size:15px}
.grab small{color:var(--soft);font-weight:400;font-size:13px}
.tabs{display:flex;gap:22px;padding:0 22px 6px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--soft);font:inherit;font-weight:700;font-size:15px;padding:6px 0}
.tabs button.on{color:#fff;border-color:var(--r)}
.srch{margin:8px 22px 6px;padding:13px 16px;border-radius:14px;border:1px solid #2a0a0a;background:#150000;color:#fff;font:inherit;outline:none}
.srch:focus{border-color:var(--r)}
#list{list-style:none;overflow-y:auto;flex:1;padding:0 22px 30px}
#list li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #1d0505}
.t{flex:1;font-weight:800;font-size:17px;line-height:1.2;cursor:pointer}
li.on .t{color:var(--r)}
.h{color:var(--r);font-size:20px;padding:6px;cursor:pointer}
.empty{color:var(--soft);padding:28px 0;text-align:center}

dialog{margin:auto;border:1px solid var(--r);border-radius:22px;background:#0c0000;color:#fff;padding:22px;width:min(90vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog h3{font-size:20px;margin-bottom:6px}
dialog p{font-size:13px;color:var(--soft);margin-bottom:14px}
dialog input{width:100%;margin-bottom:10px;padding:12px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font:inherit}
.btn{background:var(--r);color:#fff;border:0;border-radius:30px;padding:12px 22px;font:inherit;font-weight:800}
.btn.g{background:none;border:1px solid #555}
#msg{display:block;margin-top:12px;font-size:13px}

@media (prefers-reduced-motion:reduce){.halo{animation:none!important}.sheet{transition:none}}

:root{--r:#c20000}
.stage::before{background:radial-gradient(ellipse at 50% 40%,rgba(170,0,0,.45),transparent 64%)}
.sun{background:radial-gradient(circle at 36% 30%,#ff2a1f,#c20000 42%,#3d0000);box-shadow:0 0 calc(40px + var(--g,0)*130px) rgba(194,0,0,calc(.45 + var(--g,0)*.5))}
.dunes path:first-child{fill:#3d0000}
.ib{background:#c20000;border-color:#ff2a1f;box-shadow:0 0 18px rgba(194,0,0,.6)}
.logo{letter-spacing:1px}
.logo svg{vertical-align:-4px;margin-right:6px;color:#ff2a1f}
.ti,.t{text-transform:uppercase;letter-spacing:.5px}
.ti{font-size:clamp(20px,6.4vw,28px)}
.nv{color:#c20000;opacity:1}
#pg{stroke:#ff2a1f;filter:drop-shadow(0 0 3px #ff2a1f)}
.ring circle:first-child{stroke:#3d0000}
.tools button{color:#8a0000;opacity:1}
.tools button.on{color:#ff2a1f;filter:drop-shadow(0 0 6px #ff2a1f)}
.tools #hf{font-size:30px;line-height:1}
.sheet{background:#050000;border-top:3px solid var(--r)}
#list li{border-bottom-color:#2a0000;border-left:3px solid transparent;padding-left:10px}
#list li.on{border-left-color:#ff2a1f;background:linear-gradient(90deg,rgba(194,0,0,.3),transparent)}
li.on .t{color:#ff2a1f}
.h{color:#ff2a1f}
.tabs button.on{border-color:#ff2a1f}
dialog{background:#050000;border-color:#c20000}
.btn{background:#c20000;box-shadow:0 0 16px rgba(194,0,0,.5)}
</style></head><body>

<div class="stage" id="stage">
  <div class="bar">
    <div class="logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>VIVI <i>MUSIC</i></div>
    <button class="ib" id="ub" aria-label="Ajouter une musique">＋</button>
  </div>

  <svg class="dunes" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,115 C60,70 120,60 200,92 C280,122 330,52 400,72 L400,200 L0,200Z" fill="#2a0000"/>
    <path d="M0,150 C80,112 150,132 230,146 C300,158 350,122 400,132 L400,200 L0,200Z" fill="#000"/>
  </svg>

  <div class="mid" id="mid">
    <div class="row">
      <button class="nv" id="pv" aria-label="Précédent">‹</button>
      <div class="wrap">
        <div class="halo" id="halo">
          <button class="sun" id="sun" aria-label="Lecture / pause"><span id="ic">▶</span></button>
        </div>
        <svg class="ring" id="ring" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="47" fill="none" stroke="#2b0000" stroke-width="1.6"/>
          <circle id="pg" cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" transform="rotate(-90 50 50)"/>
          <circle id="hit" cx="50" cy="50" r="47" fill="none" stroke="transparent" stroke-width="9"/>
        </svg>
      </div>
      <button class="nv" id="nx" aria-label="Suivant">›</button>
    </div>
    <div class="ti" id="ti">Touche le soleil pour écouter</div>
    <div class="tm" id="tm">0:00 sur 0:00</div>
    <div class="tools">
      <button id="sh" aria-label="Aléatoire"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
      <button id="hf" aria-label="Favori">♡</button>
      <button id="rp" aria-label="Répéter"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <button class="grab" id="grab"><span>Bibliothèque</span><small id="cnt">0 titre</small></button>
    <div class="tabs">
      <button data-t="all" class="on">Tout</button>
      <button data-t="fav">Favoris</button>
    </div>
    <input class="srch" id="q" placeholder="Rechercher une musique">
    <ul id="list"></ul>
  </div>
</div>

<dialog id="dlg">
  <h3>Ajouter une musique</h3>
  <p>Réservé aux artistes avec le code.</p>
  <input type="password" id="code" placeholder="Code artiste">
  <input type="file" id="file" accept="audio/*">
  <button class="btn" id="send">Envoyer</button>
  <button class="btn g" id="cl">Fermer</button>
  <span id="msg"></span>
</dialog>

<audio id="a"></audio>

<script>
const $=id=>document.getElementById(id);
const a=$("a"),sun=$("sun"),stage=$("stage");
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
let songs=[],cur=-1,tab="all",shuf=false,sm=0,ctx,an,data;
let favs=[];try{favs=JSON.parse(localStorage.getItem("favs")||"[]")}catch(e){}
const nice=f=>f.replace(/\.[^.]+$/,"").replace(/_/g," ");
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const C=2*Math.PI*47;
$("pg").style.strokeDasharray=C;$("pg").style.strokeDashoffset=C;

function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaElementSource(a);
  an=ctx.createAnalyser();an.fftSize=256;
  src.connect(an);an.connect(ctx.destination);
  data=new Uint8Array(an.frequencyBinCount);
}
function loop(){
  requestAnimationFrame(loop);
  let b=0;
  if(an&&!a.paused&&!calm){
    an.getByteFrequencyData(data);
    let s=0;for(let i=0;i<6;i++)s+=data[i];
    b=s/6/255;
  }
  sm=sm*.8+b*.2;
  sun.style.transform="scale("+(1+sm*.14)+")";
  sun.style.setProperty("--g",sm.toFixed(3));
}
loop();

function info(){
  $("ti").textContent=cur>=0?nice(songs[cur]):"Touche le soleil pour écouter";
  $("hf").textContent=cur>=0&&favs.includes(songs[cur])?"❤":"♡";
  $("hf").classList.toggle("on",cur>=0&&favs.includes(songs[cur]));
}
function toggleFav(f){
  favs=favs.includes(f)?favs.filter(x=>x!==f):[...favs,f];
  localStorage.setItem("favs",JSON.stringify(favs));
  info();render();
}
function render(){
  $("cnt").textContent=songs.length+(songs.length>1?" titres":" titre");
  const q=$("q").value.toLowerCase();
  $("list").innerHTML="";
  let n=0;
  songs.forEach((f,i)=>{
    if(!nice(f).toLowerCase().includes(q))return;
    if(tab=="fav"&&!favs.includes(f))return;
    n++;
    const li=document.createElement("li");
    if(i===cur)li.className="on";
    const t=document.createElement("span");t.className="t";t.textContent=nice(f);
    t.onclick=()=>{play(i);$("sheet").classList.remove("open")};
    const h=document.createElement("span");h.className="h";
    h.textContent=favs.includes(f)?"❤":"♡";
    h.onclick=()=>toggleFav(f);
    li.append(t,h);$("list").appendChild(li);
  });
  if(!n){
    const e=document.createElement("div");e.className="empty";
    e.textContent=tab=="fav"?"Touche ♡ sur un titre pour l'ajouter ici":"Aucune musique trouvée";
    $("list").appendChild(e);
  }
}
function play(i){
  if(!songs.length)return;
  initAudio();if(ctx.state==="suspended")ctx.resume();
  cur=(i+songs.length)%songs.length;
  a.src="/music/"+encodeURIComponent(songs[cur]);
  a.play().catch(()=>{});
  info();render();
}
function next(){play(shuf?Math.floor(Math.random()*songs.length):cur+1)}
function load(){fetch("/api/songs").then(r=>r.json()).then(s=>{songs=s;render()})}

sun.onclick=()=>{
  if(cur<0){play(0);return}
  initAudio();if(ctx.state==="suspended")ctx.resume();
  a.paused?a.play():a.pause();
};
$("nx").onclick=next;
$("pv").onclick=()=>play(cur<0?0:cur-1);
$("sh").onclick=()=>{shuf=!shuf;$("sh").classList.toggle("on",shuf)};
$("rp").onclick=()=>{a.loop=!a.loop;$("rp").classList.toggle("on",a.loop)};
$("hf").onclick=()=>{if(cur>=0)toggleFav(songs[cur])};
$("grab").onclick=()=>$("sheet").classList.toggle("open");
$("q").oninput=render;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  render();
});

a.onplay=()=>{stage.classList.add("playing");$("ic").textContent="❚❚"};
a.onpause=()=>{stage.classList.remove("playing");$("ic").textContent="▶"};
a.onended=next;
a.ontimeupdate=()=>{
  const f=a.duration?a.currentTime/a.duration:0;
  $("pg").style.strokeDashoffset=C*(1-f);
  $("tm").textContent=fmt(a.currentTime)+" sur "+fmt(a.duration);
};

const hit=$("hit"),ring=$("ring");
let seeking=false;
function seekAt(e){
  const r=ring.getBoundingClientRect();
  const x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
  let ang=Math.atan2(y,x)+Math.PI/2;if(ang<0)ang+=2*Math.PI;
  if(a.duration)a.currentTime=ang/(2*Math.PI)*a.duration;
}
hit.addEventListener("pointerdown",e=>{seeking=true;hit.setPointerCapture(e.pointerId);seekAt(e)});
hit.addEventListener("pointermove",e=>{if(seeking)seekAt(e)});
hit.addEventListener("pointerup",()=>seeking=false);
hit.addEventListener("pointercancel",()=>seeking=false);

let sx=null;
$("mid").addEventListener("touchstart",e=>{sx=e.target===hit?null:e.touches[0].clientX},{passive:true});
$("mid").addEventListener("touchend",e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>70)dx<0?next():play(cur-1);
  sx=null;
});

$("ub").onclick=()=>$("dlg").showModal();
$("cl").onclick=()=>$("dlg").close();
$("send").onclick=()=>{
  const f=$("file").files[0];
  if(!f){$("msg").textContent="Choisis un fichier audio.";return}
  const d=new FormData();d.append("file",f);d.append("code",$("code").value);
  fetch("/api/upload",{method:"POST",body:d}).then(r=>r.json()).then(j=>{
    $("msg").textContent=j.ok?"✅ Musique ajoutée":"❌ "+j.error;
    if(j.ok)load();
  });
};
load();
</script></body></html>
